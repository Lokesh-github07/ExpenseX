services:

  postgres:
    image: postgres:17
    container_name: expense-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "2004:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_tracker"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: expense-tracker-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/expense_tracker
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}

      # Brevo SMTP Configuration
      BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY}
      MAIL_FROM: ${MAIL_FROM}

      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_CONSOLE_FALLBACK: ${MAIL_CONSOLE_FALLBACK:-false}

      # Application Settings
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      THYMELEAF_CACHE: ${THYMELEAF_CACHE:-true}

      # Financial API
      FINANCIAL_API_KEY: ${FINANCIAL_API_KEY:-}

volumes:
  postgres-data: