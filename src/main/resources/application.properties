# ============================================================
# LOAD .env FOR LOCAL RUNS (IntelliJ / mvn spring-boot:run / java -jar)
# ============================================================
# Spring Boot does NOT read a .env file by itself - only docker-compose does.
# Without this line ${MAIL_USERNAME} / ${MAIL_APP_PASSWORD} stay unresolved,
# Gmail login fails and the OTP only shows up in the console.
# "optional:" = no error when the file is missing (e.g. inside Docker, where
# real environment variables are used instead and always take priority).
spring.config.import=optional:file:./.env[.properties]

# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:2004/expense_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ============================================================
# THYMELEAF
# ============================================================

spring.thymeleaf.cache=false


# ============================================================
# SERVER
# ============================================================

server.port=8080


# ============================================================
# JWT
# ============================================================

app.jwt.secret=${JWT_SECRET}

app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}


# ============================================================
# EMAIL / GMAIL SMTP
# ============================================================

mail.enabled=${MAIL_ENABLED:true}

# DEV ONLY: when true, a failed SMTP send prints the OTP in the console instead
# of returning an error. Keep false so failures are visible to you and the user.
mail.console-fallback=${MAIL_CONSOLE_FALLBACK:false}

spring.mail.default-encoding=UTF-8

spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Defaults are intentionally empty so a missing local secret produces a clear
# startup diagnostic instead of an unresolved-placeholder startup failure.
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ============================================================
# FRED FINANCIAL DATA API
# ============================================================

fred.api.key=${FINANCIAL_API_KEY:}
fred.api.base-url=https://api.stlouisfed.org/fred