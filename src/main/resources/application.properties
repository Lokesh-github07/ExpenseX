
# ============================================================
# LOAD .env FOR LOCAL RUNS
# ============================================================

spring.config.import=optional:file:./.env[.properties]


# ============================================================
# DATABASE - POSTGRESQL
# ============================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:2004/expense_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update

# Disable SQL logging in production
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false


# ============================================================
# THYMELEAF
# ============================================================

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}


# ============================================================
# SERVER
# ============================================================

server.port=${PORT:8080}


# ============================================================
# JWT
# ============================================================

app.jwt.secret=${JWT_SECRET}

app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}


# ============================================================
# EMAIL - BREVO SMTP
# ============================================================

mail.enabled=${MAIL_ENABLED:true}

# Never enable console fallback in production
mail.console-fallback=${MAIL_CONSOLE_FALLBACK:false}

spring.mail.default-encoding=UTF-8

# Brevo SMTP server
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525

# Brevo SMTP credentials
spring.mail.username=${BREVO_SMTP_LOGIN:}
spring.mail.password=${BREVO_SMTP_KEY:}

# Verified sender email address
app.mail.from=${MAIL_FROM:}

# SMTP authentication
spring.mail.properties.mail.smtp.auth=true

# STARTTLS configuration
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# SSL/TLS configuration
spring.mail.properties.mail.smtp.ssl.trust=smtp-relay.brevo.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3

# SMTP timeouts
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000


# ============================================================
# FRED FINANCIAL DATA API
# ============================================================

fred.api.key=${FINANCIAL_API_KEY:}
fred.api.base-url=https://api.stlouisfed.org/fred
