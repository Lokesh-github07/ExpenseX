# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:2004/expense_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ============================================================
# THYMELEAF
# ============================================================

spring.thymeleaf.cache=false


# ============================================================
# SERVER
# ============================================================

server.port=8080


# ============================================================
# JWT
# ============================================================

app.jwt.secret=${JWT_SECRET}

app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}


# ============================================================
# EMAIL / GMAIL SMTP
# ============================================================

mail.enabled=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================================
# FRED FINANCIAL DATA API
# ============================================================

fred.api.key=${FINANCIAL_API_KEY:}
fred.api.base-url=https://api.stlouisfed.org/fred