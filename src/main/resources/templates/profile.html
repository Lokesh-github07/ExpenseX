<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">

    <title>Profile | ExpenseX</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="background"></div>

<div class="dashboard">

    <aside th:replace="~{fragments/sidebar :: sidebar('profile')}"></aside>

    <main class="content">

        <div class="content-topbar">
            <button type="button" class="mobile-sidebar-toggle" id="mobileSidebarToggle"
                    aria-label="Open navigation" aria-controls="appSidebar" aria-expanded="false">
                <span aria-hidden="true">☰</span>
            </button>
            <h1>Profile</h1>
        </div>

        <div class="glass-card table-card">

            <div class="profile-header">

                <div class="avatar-circle" id="avatarInitials">--</div>

                <div>
                    <h2 id="profileName">Loading...</h2>
                    <p id="profileEmail"></p>
                    <span class="status-pill" id="verifiedPill"></span>
                </div>

            </div>

            <div class="info-grid">

                <div class="info-item">
                    <label>Member Since</label>
                    <p id="memberSince">--</p>
                </div>

                <div class="info-item">
                    <label>Account Status</label>
                    <p id="accountStatus">--</p>
                </div>

                <div class="info-item">
                    <label>Phone Number</label>
                    <p id="phoneDisplay">Not set</p>
                </div>

            </div>

        </div>

        <div class="profile-grid">

            <div class="glass-card table-card">

                <div class="table-header">
                    <h2>Edit Personal Details</h2>
                </div>

                <form id="profileForm" style="margin-top:20px;">

                    <div class="row">

                        <div class="col">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" required>
                        </div>

                        <div class="col">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" required>
                        </div>

                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" disabled
                               style="opacity:.7;cursor:not-allowed;">
                    </div>

                    <div class="input-group">
                        <label for="phoneNumber">Phone Number</label>
                        <input type="tel" id="phoneNumber" placeholder="e.g. +91 9876543210">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Save Changes</button>
                    </div>

                    <p class="form-msg" id="formMsg"></p>

                </form>

            </div>

            <div class="glass-card table-card">

                <div class="table-header">
                    <h2>Account</h2>
                </div>

                <p style="margin:12px 0 18px;color:var(--text-secondary);font-size:14px;">
                    Password, session and account-deletion controls are in
                    Security &amp; Privacy.
                </p>

                <div class="profile-shortcuts">
                    <a class="btn-secondary" th:href="@{/security-privacy}"
                       style="width:auto;padding:10px 16px;">🔐 Security &amp; Privacy</a>
                    <a class="btn-secondary" th:href="@{/settings}"
                       style="width:auto;padding:10px 16px;">⚙️ Settings</a>
                </div>

                <h3 style="margin:28px 0 8px;font-size:15px;">Log out</h3>
                <p style="margin-bottom:14px;color:var(--text-muted);font-size:13px;">
                    End your session on this browser. You will need to sign in again.
                </p>

                <button type="button" class="btn-outline-danger" id="logoutBtn">
                    ↪ Log out
                </button>

            </div>

        </div>


    </main>

    <!-- Shared Footer (sits under the content column, beside the fixed sidebar) -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

<script th:src="@{/js/script.js}"></script>
<script>

    // script.js already redirects to /login when there is no token.
    const token = localStorage.getItem("token");

    let currentUserId = null;

    function initials(first, last){
        const a = (first || "").trim()[0] || "";
        const b = (last || "").trim()[0] || "";
        return (a + b).toUpperCase() || "?";
    }

    function formatLongDate(value){
        if(!value) return "--";
        const d = new Date(value);
        return d.toLocaleDateString("en-IN", { year: "numeric", month: "long", day: "numeric" });
    }

    async function loadProfile() {
        try {
            if (!token) {
                window.location.href = "/login";
                return;
            }

            const tokenPayload = token.split(".")[1];

            if (!tokenPayload) {
                throw new Error("Invalid authentication token.");
            }

            // JWT payloads use Base64URL encoding.
            const base64 = tokenPayload
                .replace(/-/g, "+")
                .replace(/_/g, "/");

            const decodedPayload = atob(
                base64.padEnd(Math.ceil(base64.length / 4) * 4, "=")
            );

            const email = JSON.parse(decodedPayload).sub;

            if (!email) {
                throw new Error("Email not found in authentication token.");
            }

            const response = await fetch(
                "/api/users/email/" + encodeURIComponent(email),
                {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            if (response.status === 401 || response.status === 403) {
                logout();
                return;
            }

            if (!response.ok) {
                throw new Error("Unable to load profile.");
            }

            const user = await response.json();

            currentUserId = user.id;

            document.getElementById("avatarInitials").textContent =
                initials(user.firstName, user.lastName);

            document.getElementById("profileName").textContent =
                `${user.firstName || ""} ${user.lastName || ""}`.trim();

            document.getElementById("profileEmail").textContent =
                user.email || "";

            const verifiedPill = document.getElementById("verifiedPill");

            if (user.emailVerified) {
                verifiedPill.textContent = "✓ Email Verified";
                verifiedPill.className = "status-pill verified";
            } else {
                verifiedPill.textContent = "Email Not Verified";
                verifiedPill.className = "status-pill unverified";
            }

            document.getElementById("memberSince").textContent =
                formatLongDate(user.createdAt);

            document.getElementById("accountStatus").textContent =
                user.active ? "Active" : "Inactive";

            document.getElementById("phoneDisplay").textContent =
                user.phoneNumber || "Not set";

            document.getElementById("firstName").value =
                user.firstName || "";

            document.getElementById("lastName").value =
                user.lastName || "";

            document.getElementById("email").value =
                user.email || "";

            document.getElementById("phoneNumber").value =
                user.phoneNumber || "";

        } catch (error) {
            console.error("Profile loading error:", error);

            document.getElementById("profileName").textContent =
                "Unable to load profile";

            document.getElementById("profileEmail").textContent =
                "Please refresh the page or sign in again.";
        }
    }

    // Save profile - PUT /api/users/{id}/profile (unchanged API contract)
    document.getElementById("profileForm").addEventListener("submit", async (e) => {

        e.preventDefault();

        const msg = document.getElementById("formMsg");
        msg.className = "form-msg";
        msg.textContent = "";

        const payload = {
            firstName: document.getElementById("firstName").value.trim(),
            lastName: document.getElementById("lastName").value.trim(),
            phoneNumber: document.getElementById("phoneNumber").value.trim()
        };

        try {

            const res = await fetch("/api/users/" + currentUserId + "/profile", {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: "Bearer " + token
                },
                body: JSON.stringify(payload)
            });

            if(!res.ok){
                throw new Error("Update failed");
            }

            msg.textContent = "Profile updated successfully.";
            msg.className = "form-msg success";

            loadProfile();

            // Keep the name shown in the sidebar in sync.
            if (window.ExpenseX && window.ExpenseX.refreshSidebarProfile) {
                window.ExpenseX.refreshSidebarProfile();
            }

        } catch(err){
            msg.textContent = "Could not update profile. Please try again.";
            msg.className = "form-msg error";
        }
    });

    // Logout: confirmation first, then the single logout() from script.js
    document.getElementById("logoutBtn").addEventListener("click", function () {
        confirmLogout();
    });

    loadProfile();

</script>

</body>
</html>
