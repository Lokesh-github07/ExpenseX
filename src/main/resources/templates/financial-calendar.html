<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">

    <title>ExpenseX | Financial Calendar</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Shared application styles -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Financial Calendar styles -->
</head>

<body>

<div class="background" aria-hidden="true"></div>

<div class="dashboard">

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('calendar')}"></aside>

    <!-- Main Content -->
    <main class="content financial-calendar">

        <!-- Page Header -->
        <header class="fc-topbar">
            <div>
                <button type="button" class="mobile-sidebar-toggle" id="mobileSidebarToggle"
                        aria-label="Open navigation" aria-controls="appSidebar" aria-expanded="false">
                    <span aria-hidden="true">☰</span>
                </button>
                <h1>Financial Calendar</h1>
                <p class="fc-muted">
                    ExpenseX · Markets, economics and personal finances
                </p>
            </div>

            <div class="fc-header-actions">
                <button id="refreshBtn"
                        class="fc-primary"
                        type="button">
                    ↻ Refresh data
                </button>
            </div>
        </header>

        <!-- Filters -->
        <div class="fc-toolbar">
            <div class="fc-filter">
                <label for="category">Event category</label>

                <select id="category">
                    <option value="all">All events</option>
                    <option value="economic">Economic events</option>
                    <option value="earnings">Earnings</option>
                    <option value="dividend">Dividends</option>
                    <option value="ipo">IPOs</option>
                    <option value="personal">Personal reminders</option>
                </select>
            </div>

            <button id="todayBtn" type="button" class="fc-btn">
                Today
            </button>
        </div>

        <!-- Status and messages -->
        <div id="status"
             class="fc-status"
             role="status"
             aria-live="polite">
            Loading calendar...
        </div>

        <!-- Calendar Layout -->
        <div class="fc-layout">

            <!-- Monthly Calendar -->
            <section class="fc-panel"
                     aria-label="Monthly financial calendar">

                <div class="fc-calendar-header">
                    <button id="prevBtn"
                            type="button"
                            aria-label="Previous month">
                        ←
                    </button>

                    <h2 id="monthLabel">Loading...</h2>

                    <button id="nextBtn"
                            type="button"
                            aria-label="Next month">
                        →
                    </button>
                </div>

                <div class="fc-weekdays" aria-hidden="true">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>

                <div id="calendarGrid" class="fc-grid"></div>
            </section>

            <!-- Reminders and Events -->
            <aside class="fc-panel">

                <h2 class="fc-section-title">Add a reminder</h2>

                <form id="reminderForm" class="fc-reminder-form">

                    <label for="reminderTitle">Title</label>
                    <input id="reminderTitle"
                           name="title"
                           type="text"
                           required
                           maxlength="100"
                           placeholder="e.g. Rent payment">

                    <label for="reminderDate">Date</label>
                    <input id="reminderDate"
                           name="date"
                           type="date"
                           required>

                    <label for="reminderType">Type</label>
                    <select id="reminderType" name="type">
                        <option value="salary">Salary</option>
                        <option value="bill">Bill / EMI</option>
                        <option value="expense">Expense</option>
                        <option value="savings">Savings</option>
                    </select>

                    <label for="reminderAmount">Amount (INR)</label>
                    <input id="reminderAmount"
                           name="amount"
                           type="number"
                           min="0"
                           step="0.01"
                           placeholder="0.00">

                    <button class="fc-primary" type="submit">
                        Save reminder
                    </button>

                </form>

                <div class="fc-divider"></div>

                <h2 id="selectedTitle" class="fc-section-title">
                    Events
                </h2>

                <div id="eventList" class="fc-event-list"></div>
            </aside>

        </div>
    </main>
    <!-- Shared Footer (sits under the content column, beside the fixed sidebar) -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

<!-- Floating Quick Actions -->
<div class="quick-action-container" id="quickActionContainer">

    <div class="quick-action-menu"
         id="quickActionMenu"
         aria-label="Quick actions"
         hidden>

        <a class="quick-action-item" th:href="@{/add-expense}">
            <span class="quick-action-icon expense-icon">−</span>
            <span>Add Expense</span>
        </a>

        <a class="quick-action-item" th:href="@{/salary}">
            <span class="quick-action-icon income-icon">+</span>
            <span>Add Income</span>
        </a>

        <a class="quick-action-item" th:href="@{/transactions}">
            <span class="quick-action-icon transaction-icon">⇄</span>
            <span>Add Transaction</span>
        </a>

        <a class="quick-action-item" th:href="@{/savings}">
            <span class="quick-action-icon savings-icon">◎</span>
            <span>Add Savings Goal</span>
        </a>

        <a class="quick-action-item" th:href="@{/bills}">
            <span class="quick-action-icon bill-icon">▤</span>
            <span>Add Bill</span>
        </a>

    </div>

    <button type="button"
            class="floating-add-button"
            id="floatingAddButton"
            aria-label="Open quick actions"
            aria-expanded="false"
            aria-controls="quickActionMenu">
        <span class="floating-add-icon">+</span>
    </button>
</div>


<!-- Shared JavaScript: sidebar, auth and global actions -->
<script th:src="@{/js/script.js}" defer></script>

<!-- Calendar-specific JavaScript -->
<script th:src="@{/js/financial-calendar.js}" defer></script>

<noscript>
    <p style="padding:20px;text-align:center;">
        Financial Calendar requires JavaScript to be enabled.
    </p>
</noscript>

</body>
</html>
