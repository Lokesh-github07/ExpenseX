<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker | Forgot Password</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="background"></div>

<div class="center-box">

    <div class="glass-card login-card">

        <h1>Reset Password</h1>

        <p class="subtitle" id="subtitle">
            Enter your registered email to receive a 6-digit OTP.
        </p>


        <!-- ============================= -->
        <!-- STEP 1 - ENTER EMAIL -->
        <!-- ============================= -->

        <form id="forgotPasswordForm">

            <div class="input-group">

                <label>Email</label>

                <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

            </div>

            <button
                    class="btn-primary"
                    id="sendOtpButton"
                    type="submit">

                Send OTP

            </button>

        </form>


        <!-- ============================= -->
        <!-- STEP 2 - OTP + NEW PASSWORD -->
        <!-- ============================= -->

        <form id="resetPasswordForm" style="display:none;">

            <div class="input-group">

                <label>OTP</label>

                <input
                        type="text"
                        id="otp"
                        placeholder="Enter 6-digit OTP"
                        maxlength="6"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        required>

            </div>


            <div class="input-group">

                <label>New Password</label>

                <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        required>

            </div>


            <div class="input-group">

                <label>Confirm Password</label>

                <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        required>

            </div>


            <button
                    class="btn-primary"
                    id="resetPasswordButton"
                    type="submit">

                Reset Password

            </button>


            <button
                    class="btn-primary"
                    id="resendOtpButton"
                    type="button"
                    style="margin-top:10px;">

                Resend OTP

            </button>

        </form>


        <!-- Message -->
        <p
                id="message"
                style="
                    margin-top:15px;
                    text-align:center;
                ">
        </p>


        <!-- Links -->

        <div class="links">

            <a th:href="@{/login}">
                Back to Login
            </a>

        </div>

    </div>

</div>


<script th:src="@{/js/script.js}"></script>


<script>

    const forgotPasswordForm =
        document.getElementById("forgotPasswordForm");

    const resetPasswordForm =
        document.getElementById("resetPasswordForm");

    const emailInput =
        document.getElementById("email");

    const otpInput =
        document.getElementById("otp");

    const newPasswordInput =
        document.getElementById("newPassword");

    const confirmPasswordInput =
        document.getElementById("confirmPassword");

    const sendOtpButton =
        document.getElementById("sendOtpButton");

    const resetPasswordButton =
        document.getElementById("resetPasswordButton");

    const resendOtpButton =
        document.getElementById("resendOtpButton");

    const message =
        document.getElementById("message");

    const subtitle =
        document.getElementById("subtitle");


    // ==========================================
    // SHOW MESSAGE
    // ==========================================

    function showMessage(text, success = false) {

        message.textContent = text;

        if (success) {

            message.style.color = "#7CFF9B";

        } else {

            message.style.color = "#ff6b6b";

        }
    }


    // ==========================================
    // SEND OTP
    // ==========================================

    async function sendOtp() {

        const email =
            emailInput.value.trim();


        if (!email) {

            showMessage(
                "Please enter your email."
            );

            return;

        }


        sendOtpButton.disabled = true;

        sendOtpButton.textContent =
            "Sending OTP...";


        try {

            const response =
                await fetch(
                    "/api/auth/forgot-password",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email
                        })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to send OTP."
                );

            }


            showMessage(
                "OTP sent successfully. Check your email.",
                true
            );


            // Hide email form
            forgotPasswordForm.style.display =
                "none";


            // Show OTP form
            resetPasswordForm.style.display =
                "block";


            subtitle.textContent =
                "Enter the OTP sent to your email and create a new password.";


        } catch (error) {

            showMessage(
                error.message ||
                "Something went wrong."
            );

        } finally {

            sendOtpButton.disabled = false;

            sendOtpButton.textContent =
                "Send OTP";

        }

    }


    // ==========================================
    // FIRST SEND OTP
    // ==========================================

    forgotPasswordForm.addEventListener(
        "submit",
        function (event) {

            event.preventDefault();

            sendOtp();

        }
    );


    // ==========================================
    // RESET PASSWORD
    // ==========================================

    resetPasswordForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const email =
                emailInput.value.trim();

            const otp =
                otpInput.value.trim();

            const newPassword =
                newPasswordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            // Validate OTP

            if (!/^\d{6}$/.test(otp)) {

                showMessage(
                    "OTP must contain exactly 6 digits."
                );

                return;

            }


            // Validate passwords

            if (!newPassword) {

                showMessage(
                    "Please enter a new password."
                );

                return;

            }


            if (newPassword !== confirmPassword) {

                showMessage(
                    "Passwords do not match."
                );

                return;

            }


            resetPasswordButton.disabled =
                true;

            resetPasswordButton.textContent =
                "Resetting...";


            try {

                const response =
                    await fetch(
                        "/api/auth/reset-password",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                email: email,

                                otp: otp,

                                newPassword: newPassword,

                                confirmPassword: confirmPassword

                            })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Password reset failed."
                    );

                }


                showMessage(
                    "Password reset successfully! Redirecting to login...",
                    true
                );


                setTimeout(
                    function () {

                        window.location.href =
                            "/login";

                    },
                    2000
                );


            } catch (error) {

                showMessage(
                    error.message ||
                    "Something went wrong."
                );

            } finally {

                resetPasswordButton.disabled =
                    false;

                resetPasswordButton.textContent =
                    "Reset Password";

            }

        }
    );


    // ==========================================
    // RESEND OTP
    // ==========================================

    resendOtpButton.addEventListener(
        "click",
        async function () {

            const email =
                emailInput.value.trim();


            if (!email) {

                showMessage(
                    "Email address is missing."
                );

                return;

            }


            resendOtpButton.disabled =
                true;

            resendOtpButton.textContent =
                "Sending...";


            try {

                const response =
                    await fetch(
                        "/api/auth/forgot-password",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email: email
                            })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to resend OTP."
                    );

                }


                showMessage(
                    "A new OTP has been sent to your email.",
                    true
                );


                // Clear old OTP

                otpInput.value = "";


            } catch (error) {

                showMessage(
                    error.message ||
                    "Something went wrong."
                );

            } finally {

                resendOtpButton.disabled =
                    false;

                resendOtpButton.textContent =
                    "Resend OTP";

            }

        }
    );


    // ==========================================
    // ALLOW ONLY NUMBERS IN OTP
    // ==========================================

    otpInput.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 6);

        }
    );

</script>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
